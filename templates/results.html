<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultats de l'analyse | InsightFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #1f2937;
            padding-top: 30px;
            padding-bottom: 30px;
        }
        .container {
            max-width: 1000px;
        }
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h1 {
            font-size: clamp(2rem, 3vw, 2.6rem);
            font-weight: 700;
            color: #0f172a;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
            overflow: hidden;
            margin-bottom: 22px;
        }
        .card-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 700;
            color: #0f172a;
            padding: 14px 18px;
        }
        .card-body {
            padding: 18px;
            background: white;
        }
        .table {
            margin-bottom: 0;
            text-align: left;
            direction: ltr;
        }
        .btn-secondary {
            background: #0f172a;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .btn-secondary:hover {
            background: #1e293b;
        }
        .summary-box {
            white-space: pre-wrap;
            line-height: 1.75;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>📊 Résultats de l'analyse</h1>
        </div>

        <div class="card">
            <div class="card-header">Aperçu des données</div>
            <div class="card-body">
                {{ df_head|safe }}
            </div>
        </div>

        {% if change_text %}
        <div class="card">
            <div class="card-header">Évolution des ventes</div>
            <div class="card-body">
                <p class="card-text mb-0">{{ change_text }}</p>
            </div>
        </div>
        {% endif %}

        <div class="card">
            <div class="card-header">Résumé professionnel</div>
            <div class="card-body summary-box">{{ llm_result }}</div>
        </div>

        <a href="/" class="btn btn-secondary mt-2">Retour</a>
    </div>
</body>
</html>
